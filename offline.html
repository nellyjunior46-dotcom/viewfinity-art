<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#070B08">
 <meta name="robots" content="noindex">
 <title>You're Offline — VIEWFINITY®</title>
 <style>
.vf-offline-screen,.vf-offline-screen *{box-sizing:border-box}
.vf-offline-screen[hidden]{display:none!important}
.vf-offline-screen{
 position:fixed!important;inset:0!important;z-index:2147483647!important;
 width:100%!important;height:100dvh!important;overflow:auto!important;
 color:#f5f6f1!important;background:#070b08!important;
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;
 -webkit-font-smoothing:antialiased;overscroll-behavior:contain;
}
.vf-offline-inner{
 width:100%;min-height:100%;max-width:600px;margin:0 auto;
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:clamp(36px,7svh,64px) 24px max(34px,env(safe-area-inset-bottom,0px));
 text-align:center;
}
.vf-offline-logo{display:flex;align-items:center;justify-content:center;line-height:0}
.vf-offline-logo img{display:block;width:clamp(160px,48vw,205px);max-width:100%;height:auto;object-fit:contain}
.vf-offline-main{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;margin:36px auto 32px}
.vf-offline-icon{
 width:clamp(92px,25vw,110px);height:clamp(92px,25vw,110px);
 border-radius:24px;background:#222d11;
 display:flex;align-items:center;justify-content:center;
 color:#f5f6f1;
}
.vf-offline-icon svg{width:50%;height:50%;display:block}
.vf-offline-heading{margin:29px 0 0;font-weight:850;font-size:clamp(39px,11.4vw,59px);line-height:.99;letter-spacing:-.062em;color:#f5f6f1}
.vf-offline-heading span{display:block}
.vf-offline-heading .vf-offline-accent{color:#84953f}
.vf-offline-description{font-size:clamp(14px,3.8vw,17px);line-height:1.48;color:#a8aea4;max-width:328px;margin:21px 0 0;font-weight:400}
.vf-offline-retry{
 width:min(100%,290px);min-height:52px;margin-top:36px;
 display:flex;align-items:center;justify-content:center;
 border:0;border-radius:999px;background:#84953f;color:#070b08;
 font:750 16px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 cursor:pointer;transition:transform .2s ease,background-color .2s ease,opacity .2s ease;
 -webkit-tap-highlight-color:transparent;
}
.vf-offline-retry:hover{background:#a0b453}
.vf-offline-retry:active{transform:scale(.97)}
.vf-offline-retry:focus-visible{outline:2px solid #eff6d6;outline-offset:4px}
.vf-offline-retry:disabled{opacity:.68;cursor:wait}
.vf-offline-tagline{
 display:flex;align-items:center;justify-content:center;gap:13px;
 width:100%;white-space:nowrap;color:#c3c7bc;
 font-size:clamp(8px,2.25vw,11px);font-weight:550;letter-spacing:.23em;line-height:1.3;
}
.vf-offline-tagline::before,.vf-offline-tagline::after{
 content:"";display:block;flex:0 1 28px;height:1px;background:#646e5f
}
.vf-offline-tagline b{color:#84953f;font-weight:750}
body.vf-offline-active{overflow:hidden!important}
@media(max-height:690px){
 .vf-offline-inner{padding-top:26px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
 .vf-offline-main{margin:20px auto}
 .vf-offline-icon{width:78px;height:78px;border-radius:19px}
 .vf-offline-heading{margin-top:18px;font-size:clamp(36px,10.5vw,50px)}
 .vf-offline-description{margin-top:13px}
 .vf-offline-retry{margin-top:22px;min-height:48px}
}
@media(min-width:761px){
 .vf-offline-inner{padding-top:65px;padding-bottom:50px}
 .vf-offline-heading{font-size:58px}
}
@media(prefers-reduced-motion:reduce){.vf-offline-retry{transition:none}}
</style>
</head>
<body style="margin:0;background:#070b08">
 <div class="vf-offline-screen">
<div class="vf-offline-inner">
 <div class="vf-offline-logo"><img src="/assets/media/c0b84cfe6d6fdbcf67.png" width="1048" height="144" alt="VIEWFINITY" decoding="async"></div>
 <main class="vf-offline-main">
  <div class="vf-offline-icon" aria-hidden="true">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.9a16 16 0 0 1 20 0M5.2 12.3a11 11 0 0 1 13.6 0M8.6 15.7a5.5 5.5 0 0 1 6.8 0"/>
    <circle cx="12" cy="20" r="1.15" fill="currentColor" stroke="none"/>
    <path d="M3.2 3.2 20.8 20.8" stroke="#f5f6f1" stroke-width="2.6"/>
   </svg>
  </div>
  <h1 class="vf-offline-heading"><span>No Internet</span><span class="vf-offline-accent">Connection</span></h1>
  <p class="vf-offline-description" id="vf-offline-message" role="status">Looks like you’re offline. Check your connection and try again.</p>
  <button class="vf-offline-retry" type="button" id="vf-offline-retry">Try Again</button>
 </main>
 <footer class="vf-offline-tagline"><span>CRE<b>8</b>TING BEYOND LIMITS</span></footer>
</div></div>
 <script>
 (()=>{
  const button=document.getElementById('vf-offline-retry');
  const message=document.getElementById('vf-offline-message');
  
async function vfOfflineProbe(){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),6000);
 try{
  const result=await fetch('/offline.html?vf-connectivity='+Date.now(),{cache:'no-store',signal:controller.signal});
  return result.ok;
 }catch{return false}
 finally{clearTimeout(timeout)}
}

  let checking=false;
  async function retry(){
   if(checking)return;
   checking=true;button.disabled=true;message.textContent='Checking your connection…';
   try{
    if(await vfOfflineProbe()){
     const destination=location.pathname.endsWith('/offline.html')?'/':location.href;
     location.replace(destination);
     return;
    }
    message.textContent='Still offline. Check your connection and try again.';
   }finally{checking=false;button.disabled=false}
  }
  button.addEventListener('click',retry);
  window.addEventListener('online',retry);
 })();
 </script>
</body>
</html>
